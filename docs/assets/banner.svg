    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#153a42"/></linearGradient>
  </defs>
  <rect width="1200" height="400" rx="22" fill="url(#bg)"/>
  <g font-family="Inter, Arial, 'PingFang SC', sans-serif">
