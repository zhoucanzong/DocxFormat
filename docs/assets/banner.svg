    <text x="54" y="150" fill="#fff" font-size="60" font-weight="700">DocxFormat</text>
    <text x="57" y="194" fill="#cfdfeb" font-size="22">DOCX / Markdown 文档规范化</text>
    <text x="57" y="232" fill="#a6bdc9" font-size="16">模板与文字规则 · 特殊对象保留 · Word 原生修订</text>
    <g font-size="14" fill="#c5e5de">
